name: Daily Offer Update

on:
  schedule:
    # 03:00 Sri Lanka time = 21:30 UTC (UTC+5:30)
    - cron: '30 21 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run crawler
        run: python scripts/crawler.py
        # outputs offers.json in repo root

      - name: Inject offers into index.html
        run: python scripts/inject_offers.py scripts/offers.json index.html

      - name: Commit & push if changed
        run: |
          git config user.name  "fuzentra-bot"
          git config user.email "bot@fuzentra.com"
          git add index.html scripts/offers.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(TZ="Asia/Colombo" date "+%d %b %Y %H:%M")
            git commit -m "chore: daily offer update — ${DATE} (LKT)"
            git push
          fi
